# A release on a pushed tag vX.Y.Z: this package's CI on the tagged commit (ci.yml, called), then the
# checks (the tag is package.json's version, CHANGELOG.md has its section), the GitHub release with the
# changelog's section as notes and the tarball attached, and `npm publish --provenance` - only when the
# repository holds the secret NPM_TOKEN (an npm automation or granular token allowed to publish
# @omniplay/node); without it, a notice, and the maintainer publishes by hand.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the GitHub release
      id-token: write   # npm's provenance statement
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: The tag is package.json's version, the changelog has its section
        id: version
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          declared=$(jq -r .version package.json)
          if [ "$declared" != "$version" ]; then echo "::error::package.json says $declared, the tag $GITHUB_REF_NAME."; exit 1; fi
          awk -v v="$version" '/^## /{ if (found) exit; h=$0; gsub(/[\[\]]/, "", h); split(h, w, /[ \t]+/); if (w[2] == v) { found=1; next } } found' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "::error::CHANGELOG.md has no section ## [$version]."; exit 1; fi
          case "$version" in *-*|0.*) echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=" >> "$GITHUB_OUTPUT" ;; esac

      - name: The tarball
        run: npm pack

      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md ${{ steps.version.outputs.prerelease }} omniplay-node-*.tgz

      - name: npm publish, when NPM_TOKEN is set
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::No NPM_TOKEN secret: not published. By hand: npm publish --access public (docs in README, Releasing)."
            exit 0
          fi
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish --provenance --access public --tag "$tag"
